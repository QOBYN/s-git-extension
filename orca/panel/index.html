<!doctype html>
<!-- Entry panel của plugin Orca (orca/plugin/orca-plugin.json → contributes.panels[].entry,

     data-sg-host bật bảng màu Orca trong src/styles/orca.css ngay từ lúc tải. -->
<html lang="en" data-sg-host="orca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S-Git</title>
  </head>
  <body>
    <!-- Text tĩnh: còn thấy nghĩa là bundle JS chưa chạy được (chẩn đoán lỗi tải). -->
    <div id="root"><p style="padding: 12px; opacity: 0.6">Loading S-Git…</p></div>
    <script type="module" src="../../src/main.tsx"></script>
  </body>
</html>
