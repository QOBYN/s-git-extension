<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Icon Marketplace (nguồn cho media/icon.png — sinh bằng `npm run icon`).
       Motif: đường branch của commit graph uốn thành chữ S, 3 node commit nằm
       trên đường đó. Khác với media/s-git.svg (icon activity bar) ở chỗ file này
       có nền + màu cố định — Marketplace hiển thị trên nền sáng lẫn tối nên icon
       phải tự mang nền, không ăn theo theme được. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252B3B"/>
      <stop offset="1" stop-color="#161A24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Thân chữ S = đường nối commit. stroke-width 20 để còn đọc được ở 32px. -->
  <path d="M174 86 C174 58 82 58 82 102 C82 140 174 120 174 158 C174 200 82 200 82 170"
        fill="none" stroke="url(#accent)" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 node commit: 2 đầu mút + 1 điểm uốn giữa. Viền nền tạo khoảng thở giữa
       node và đường kẻ, giúp không bị dính khối khi thu nhỏ. -->
  <g fill="#E8FBFF" stroke="#1B2130" stroke-width="7">
    <circle cx="174" cy="86" r="19"/>
    <circle cx="128" cy="128" r="19"/>
    <circle cx="82" cy="170" r="19"/>
  </g>
</svg>
